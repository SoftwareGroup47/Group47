<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Hall - BUPT TA Recruitment System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ai-analysis-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            color: #fff;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .ai-score {
            font-size: 2rem;
            font-weight: 700;
            margin: 8px 0;
        }

        .ai-stars {
            color: #fbbf24;
            font-size: 1.2rem;
            margin: 4px 0;
        }

        .ai-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 8px;
            height: 10px;
            margin: 12px 0;
            overflow: hidden;
        }

        .ai-bar-fill {
            background: #4ade80;
            height: 100%;
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        .ai-detail {
            font-size: 0.9rem;
            margin: 6px 0;
            opacity: 0.95;
        }

        .ai-matched {
            color: #4ade80;
        }

        .ai-missing {
            color: #fca5a5;
        }

        .ai-suggestion {
            font-style: italic;
            opacity: 0.9;
            font-size: 0.85rem;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .workload-info {
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .no-profile-hint {
            background: #fef3c7;
            color: #92400e;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin: 12px 0;
        }

        .job-item {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="header-title">Job Hall</h1>
            <div class="btn-group">
                <a href="ta_profile.html" class="btn btn-secondary btn-small">My Profile</a>
                <a href="index.html" class="btn btn-danger btn-small" onclick="localStorage.removeItem('currentUser');">Logout</a>
            </div>
        </div>
        
        <div class="card">
            <h2 style="margin-bottom: 24px; color: #1a2a4f;">Available Jobs</h2>
            <div class="job-list" id="jobList">
                <!-- Job list dynamically generated by JavaScript -->
            </div>
        </div>
        
        <div class="card" style="margin-top: 32px;">
            <h2 style="margin-bottom: 24px; color: #1a2a4f;">My Application Status</h2>
            <div id="applicationStatusList">
                <!-- Application status list dynamically generated by JavaScript -->
            </div>
        </div>
    </div>
    
    <script src="js/storage.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'TA') {
            window.location.href = 'login.html';
        }

        function calculateMatchScore(job, userSkills) {
            if (!userSkills || !job.requirements) {
                return { score: 0, matched: 0, missing: 0, missingSkills: [] };
            }

            const jobSkills = job.requirements.toLowerCase().split(/[,，、\s]+/).filter(s => s.trim());
            const userSkillSet = new Set(userSkills.toLowerCase().split(/[,，、\s]+/).filter(s => s.trim()));

            let matched = 0;
            const missingSkills = [];

            jobSkills.forEach(skill => {
                const trimmed = skill.trim();
                if (trimmed && userSkillSet.has(trimmed)) {
                    matched++;
                } else if (trimmed) {
                    missingSkills.push(trimmed);
                }
            });

            const total = jobSkills.length || 1;
            const score = Math.round((matched / total) * 100);

            return {
                score: score,
                matched: matched,
                missing: missingSkills.length,
                missingSkills: missingSkills
            };
        }

        function getMatchLevel(score) {
            if (score >= 80) return { stars: '★★★★★', level: 'High Match', color: '#4ade80' };
            if (score >= 60) return { stars: '★★★★☆', level: 'Good Match', color: '#a3e635' };
            if (score >= 40) return { stars: '★★★☆☆', level: 'Moderate Match', color: '#eab308' };
            if (score >= 20) return { stars: '★★☆☆☆', level: 'Low Match', color: '#f97316' };
            return { stars: '★☆☆☆☆', level: 'Very Low Match', color: '#ef4444' };
        }

        function getMatchSuggestion(score) {
            if (score >= 80) return '💡 Highly recommended! Your skills closely match this position.';
            if (score >= 60) return '💡 Recommended! You meet most of the job requirements.';
            if (score >= 40) return '💡 Worth considering. We suggest building up any missing skills first.';
            return '💡 Low match. Consider exploring other more suitable positions.';
        }

        function getWorkloadAdvice(workload, accepted) {
            if (accepted >= 2) return 'You already have multiple accepted positions. Consider focusing on your current role(s).';
            if (workload >= 5) return 'You have applied for many positions. Consider focusing on your studies.';
            if (workload >= 3) return 'You have applied for several positions. Please manage your time wisely.';
            return 'Workload is normal';
        }

        function loadJobs() {
            const jobs = Storage.getJobs();
            const jobList = document.getElementById('jobList');
            
            if (jobs.length === 0) {
                jobList.innerHTML = '<div class="empty-state">No jobs available</div>';
                return;
            }

            const userSkills = currentUser.skills || '';
            const applications = Storage.getApplications();
            const myApplications = applications.filter(app => app.applicantName === currentUser.username);
            const myWorkload = myApplications.filter(app => app.status !== 'Rejected').length;
            const acceptedCount = myApplications.filter(app => app.status === 'Approved').length;
            const workloadAdvice = getWorkloadAdvice(myWorkload, acceptedCount);
            
            let html = '';
            jobs.forEach(job => {
                const matchResult = calculateMatchScore(job, userSkills);
                const matchLevel = getMatchLevel(matchResult.score);
                const suggestion = getMatchSuggestion(matchResult.score);

                html += `
                    <div class="job-item">
                        <h2 class="job-title">${job.title}</h2>
                        <p class="job-description">${job.description}</p>
                        <p class="job-meta">Publisher: ${job.publisher} | Status: ${job.status}</p>
                        <p class="job-meta">Module Code: ${job.moduleCode} | Capacity: ${job.capacity}</p>
                        <p class="job-meta"><strong>Requirements:</strong> ${job.requirements || 'N/A'}</p>
                `;

                if (userSkills) {
                    html += `
                        <div class="ai-analysis-panel">
                            <div class="ai-header">
                                <span>🤖</span> AI Smart Match Analysis
                            </div>
                            <div class="ai-score">${matchResult.score}%</div>
                            <div class="ai-stars">${matchLevel.stars} ${matchLevel.level}</div>
                            <div class="ai-bar">
                                <div class="ai-bar-fill" style="width: ${matchResult.score}%; background-color: ${matchLevel.color}"></div>
                            </div>
                            <div class="ai-detail">
                                <span class="ai-matched">✓ Matched: ${matchResult.matched} skill(s)</span>
                                <span class="ai-missing"> | ⚠ Missing: ${matchResult.missing} skill(s)</span>
                            </div>
                    `;

                    if (matchResult.missingSkills.length > 0) {
                        html += `<div class="ai-detail ai-missing">Missing Skills: ${matchResult.missingSkills.join(', ')}</div>`;
                    }

                    html += `
                            <div class="ai-suggestion">${suggestion}</div>
                            <div class="workload-info">📊 Current Workload: ${myWorkload} active application(s) | ${workloadAdvice}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="no-profile-hint">
                            ⚠ Please complete your profile (fill in skills) to receive AI match analysis.
                        </div>
                    `;
                }

                const hasApplied = myApplications.some(app => app.jobId === job.id);
                if (hasApplied) {
                    const app = myApplications.find(a => a.jobId === job.id);
                    html += `<span class="application-status status-${app.status.toLowerCase()}">Applied - ${app.status}</span>`;
                } else if (job.status === 'Open') {
                    html += `<button class="btn btn-primary btn-small apply-btn" data-job-id="${job.id}">Apply</button>`;
                } else {
                    html += `<span class="application-status status-rejected">Position Closed</span>`;
                }

                html += '</div>';
            });
            
            jobList.innerHTML = html;
            
            document.querySelectorAll('.apply-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const jobId = this.getAttribute('data-job-id');
                    applyJob(jobId);
                });
            });
        }
        
        function applyJob(jobId) {
            const jobs = Storage.getJobs();
            const job = jobs.find(j => j.id === jobId);
            
            if (!job) {
                alert('Job not found.');
                return;
            }
            
            const applications = Storage.getApplications();
            const existingApplication = applications.find(app => 
                app.jobId === jobId && app.applicantName === currentUser.username
            );
            
            if (existingApplication) {
                alert('You have already applied for this position. Please do not reapply!');
                return;
            }
            
            const application = {
                id: Date.now().toString(),
                jobId: jobId,
                jobTitle: job.title,
                applicantName: currentUser.username,
                applicationDate: new Date().toLocaleString(),
                status: 'Pending'
            };
            
            Storage.addApplication(application);
            loadApplicationStatus();
            loadJobs();
            alert('Application submitted successfully!');
        }
        
        function loadApplicationStatus() {
            const applications = Storage.getApplications();
            const myApplications = applications.filter(app => app.applicantName === currentUser.username);
            const applicationStatusList = document.getElementById('applicationStatusList');
            
            if (myApplications.length === 0) {
                applicationStatusList.innerHTML = '<div class="empty-state">No application records</div>';
                return;
            }
            
            let html = '<div class="application-list">';
            myApplications.forEach(application => {
                html += `
                    <div class="application-item">
                        <h3 class="application-title">${application.jobTitle}</h3>
                        <p class="application-meta">Application Date: ${application.applicationDate}</p>
                        <span class="application-status status-${application.status.toLowerCase()}">${application.status}</span>
                    </div>
                `;
            });
            html += '</div>';
            
            applicationStatusList.innerHTML = html;
        }
        
        loadJobs();
        loadApplicationStatus();
    </script>
</body>
</html>

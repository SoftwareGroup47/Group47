<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BUPT TA Recruitment System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Admin Login</h1>
            <p class="page-subtitle">System Administration</p>
        </div>
        
        <div class="card auth-card">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                <div class="error-message message-box" id="errorMessage" style="display: none;"></div>
                <div class="auth-link">
                    <a href="index.html" class="link">Back to Home</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/storage.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.style.display = 'none';
            
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('currentUser', JSON.stringify({ username: 'admin', role: 'Admin' }));
                window.location.href = 'admin_dashboard.html';
            } else {
                errorMessage.textContent = 'Incorrect username or password.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>

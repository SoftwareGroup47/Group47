<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BUPT TA Recruitment System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="header-title">Admin Dashboard</h1>
            <a href="index.html" class="btn btn-danger btn-small" onclick="localStorage.removeItem('currentUser');">Logout</a>
        </div>
        
        <div class="card">
            <div class="workload-section">
                <h2 style="margin-bottom: 24px; color: #1a2a4f;">TA Workload</h2>
                <div id="workloadList">
                    <!-- TA workload list dynamically generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/storage.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'Admin') {
            window.location.href = 'admin_login.html';
        }
        
        function loadTAWorkload() {
            const users = Storage.get('users') || [];
            const applications = Storage.get('applications') || [];
            const workloadList = document.getElementById('workloadList');
            
            const taUsers = users.filter(user => user.role === 'TA');
            
            if (taUsers.length === 0) {
                workloadList.innerHTML = '<div class="empty-state">No TA users</div>';
                return;
            }
            
            let html = '';
            taUsers.forEach(ta => {
                const taApplications = applications.filter(app => 
                    app.applicantName === ta.username && app.status === 'Approved'
                );
                
                let workloadClass, workloadLabel;
                if (taApplications.length >= 3) {
                    workloadClass = 'workload-high';
                    workloadLabel = 'High';
                } else if (taApplications.length === 2) {
                    workloadClass = 'workload-medium';
                    workloadLabel = 'Medium';
                } else {
                    workloadClass = 'workload-low';
                    workloadLabel = 'Low';
                }
                
                html += `
                    <div class="ta-workload ${workloadClass}">
                        <h3 class="ta-name">${ta.username}</h3>
                        <p class="ta-info">Skills: ${ta.skills || 'N/A'}</p>
                        <p class="ta-info">Grades: ${ta.grades || 'N/A'}</p>
                        <div class="workload-stats">
                            <div class="stat-item">
                                <div class="stat-label">Approved Applications</div>
                                <div class="stat-value">${taApplications.length}</div>
                                <div class="workload-label">Workload: ${workloadLabel}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            workloadList.innerHTML = html;
        }
        
        loadTAWorkload();
    </script>
</body>
</html>

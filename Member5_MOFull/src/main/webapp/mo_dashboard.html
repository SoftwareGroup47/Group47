<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO Dashboard - BUPT TA Recruitment System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ai-analysis-panel {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            color: #fff;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .ai-score {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 8px 0;
        }

        .ai-stars {
            color: #fbbf24;
            font-size: 1.1rem;
            margin: 4px 0;
        }

        .ai-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 8px;
            height: 8px;
            margin: 10px 0;
            overflow: hidden;
        }

        .ai-bar-fill {
            background: #fff;
            height: 100%;
            border-radius: 8px;
        }

        .ai-detail {
            font-size: 0.85rem;
            margin: 5px 0;
            opacity: 0.95;
        }

        .ai-matched {
            color: #4ade80;
        }

        .ai-missing {
            color: #fca5a5;
        }

        .ai-workload {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 0.8rem;
        }

        .ai-workload-item {
            background: rgba(255,255,255,0.2);
            padding: 6px 10px;
            border-radius: 8px;
        }

        .ai-advice {
            background: rgba(255,255,255,0.15);
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.85rem;
            font-style: italic;
        }

        .btn-ai {
            background: #8b5cf6;
            color: #fff;
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .btn-ai:hover {
            background: #7c3aed;
        }

        .expand-btn {
            cursor: pointer;
            color: #1c6ff1;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .hidden-panel {
            display: none;
        }
    </style>
    <script>
        function toggleAIAnalysis(appId) {
            var panel = document.getElementById('ai-panel-' + appId);
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="header-title">MO Dashboard</h1>
            <div class="btn-group">
                <a href="mo_post_job.html" class="btn btn-success btn-small">Post Job</a>
                <a href="index.html" class="btn btn-danger btn-small" onclick="localStorage.removeItem('currentUser');">Logout</a>
            </div>
        </div>
        
        <div class="card">
            <h2 style="margin-bottom: 24px; color: #1a2a4f;">Applications List</h2>
            <div id="applicationList">
                <!-- Application list dynamically generated by JavaScript -->
            </div>
        </div>
    </div>
    
    <script src="js/storage.js"></script>
    <script src="js/fileUpload.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'MO') {
            window.location.href = 'login.html';
        }

        function calculateMatchScore(jobRequirements, userSkills) {
            if (!userSkills || !jobRequirements) {
                return { score: 0, matched: 0, missing: 0, missingSkills: [] };
            }

            const jobSkills = jobRequirements.toLowerCase().split(/[,，、\s]+/).filter(s => s.trim());
            const userSkillSet = new Set(userSkills.toLowerCase().split(/[,，、\s]+/).filter(s => s.trim()));

            let matched = 0;
            const missingSkills = [];

            jobSkills.forEach(skill => {
                const trimmed = skill.trim();
                if (trimmed && userSkillSet.has(trimmed)) {
                    matched++;
                } else if (trimmed) {
                    missingSkills.push(trimmed);
                }
            });

            const total = jobSkills.length || 1;
            const score = Math.round((matched / total) * 100);

            return {
                score: score,
                matched: matched,
                missing: missingSkills.length,
                missingSkills: missingSkills
            };
        }

        function getMatchLevel(score) {
            if (score >= 80) return { stars: '★★★★★', level: 'High Match' };
            if (score >= 60) return { stars: '★★★★☆', level: 'Good Match' };
            if (score >= 40) return { stars: '★★★☆☆', level: 'Moderate Match' };
            if (score >= 20) return { stars: '★★☆☆☆', level: 'Low Match' };
            return { stars: '★☆☆☆☆', level: 'Very Low Match' };
        }

        function getWorkloadAdvice(workload, accepted) {
            if (accepted >= 2) return 'This applicant already has multiple accepted positions. Consider carefully.';
            if (workload >= 5) return 'This applicant has applied for many positions. Monitor their academic situation.';
            if (workload >= 3) return 'This applicant has applied for several positions. Evaluate reasonably.';
            return 'Workload is normal';
        }

        function loadApplications() {
            const applications = Storage.getApplications();
            const applicationList = document.getElementById('applicationList');
            
            if (applications.length === 0) {
                applicationList.innerHTML = '<div class="empty-state">No applications</div>';
                return;
            }

            const jobs = Storage.getJobs();
            
            let html = '<div class="application-list">';
            applications.forEach(application => {
                const applicant = Storage.findUserByUsername(application.applicantName);
                const skills = applicant ? (applicant.skills || 'N/A') : 'N/A';
                const grades = applicant ? (applicant.grades || 'N/A') : 'N/A';
                
                const job = jobs.find(j => j.title === application.jobTitle);
                const jobRequirements = job ? job.requirements : '';
                
                const matchResult = calculateMatchScore(jobRequirements, skills);
                const matchLevel = getMatchLevel(matchResult.score);
                
                const allApplications = Storage.getApplications();
                const applicantApps = allApplications.filter(app => app.applicantName === application.applicantName);
                const workload = applicantApps.filter(app => app.status !== 'Rejected').length;
                const acceptedCount = applicantApps.filter(app => app.status === 'Approved').length;
                const workloadAdvice = getWorkloadAdvice(workload, acceptedCount);
                
                html += `
                    <div class="application-item">
                        <h3 class="application-title">${application.jobTitle}</h3>
                        <p class="application-meta">Applicant: ${application.applicantName}</p>
                        <p class="application-meta">Application Date: ${application.applicationDate}</p>
                        <p class="application-meta">Skills: ${skills}</p>
                        <p class="application-meta">Grades: ${grades}</p>
                        <span class="application-status status-${application.status.toLowerCase()}">${application.status}</span>
                        <div class="action-buttons" style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn btn-primary btn-small btn-view-profile" data-username="${application.applicantName}">View Full Profile</button>
                            ${applicant && applicant.cvFileId ? `<button class="btn btn-secondary btn-small btn-view-resume" data-fileid="${applicant.cvFileId}">View CV</button>` : ''}
                            <button class="btn btn-ai btn-small" onclick="toggleAIAnalysis('${application.id}')">🤖 AI Analysis</button>
                            ${application.status === 'Pending' ? `
                            <button class="btn btn-success btn-small btn-approve" data-id="${application.id}">Approve</button>
                            <button class="btn btn-danger btn-small btn-reject" data-id="${application.id}">Reject</button>
                            ` : ''}
                        </div>
                        <div id="ai-panel-${application.id}" class="hidden-panel">
                            <div class="ai-analysis-panel">
                                <div class="ai-header">
                                    <span>🤖</span> AI Smart Analysis Report
                                </div>
                                <div class="ai-score">${matchResult.score}% Match</div>
                                <div class="ai-stars">${matchLevel.stars} ${matchLevel.level}</div>
                                <div class="ai-bar">
                                    <div class="ai-bar-fill" style="width: ${matchResult.score}%;"></div>
                                </div>
                                <div class="ai-detail">
                                    <span class="ai-matched">✓ Matched Skills: ${matchResult.matched} item(s)</span>
                                    <span class="ai-missing"> | ⚠ Missing Skills: ${matchResult.missing} item(s)</span>
                                </div>
                                ${matchResult.missingSkills.length > 0 ? `<div class="ai-detail ai-missing">📋 Missing Skills List: ${matchResult.missingSkills.join(', ')}</div>` : ''}
                                <div class="ai-workload">
                                    <div class="ai-workload-item">📊 Total Applications: ${workload}</div>
                                    <div class="ai-workload-item">✅ Accepted: ${acceptedCount}</div>
                                    <div class="ai-workload-item">⏳ Pending: ${workload - acceptedCount}</div>
                                </div>
                                <div class="ai-advice">
                                    💡 ${workloadAdvice}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            
            applicationList.innerHTML = html;
            
            document.querySelectorAll('.btn-approve').forEach(btn => {
                btn.addEventListener('click', function() {
                    const applicationId = this.getAttribute('data-id');
                    updateApplicationStatus(applicationId, 'Approved');
                });
            });
            
            document.querySelectorAll('.btn-reject').forEach(btn => {
                btn.addEventListener('click', function() {
                    const applicationId = this.getAttribute('data-id');
                    updateApplicationStatus(applicationId, 'Rejected');
                });
            });
            
            document.querySelectorAll('.btn-view-profile').forEach(btn => {
                btn.addEventListener('click', function() {
                    const username = this.getAttribute('data-username');
                    window.location.href = `mo_view_profile.html?username=${username}`;
                });
            });
            
            document.querySelectorAll('.btn-view-resume').forEach(btn => {
                btn.addEventListener('click', function() {
                    const fileId = this.getAttribute('data-fileid');
                    const fileUrl = FileUpload.getFileUrl(fileId);
                    if (fileUrl) {
                        window.open(fileUrl, '_blank');
                    } else {
                        alert('Unable to retrieve CV file.');
                    }
                });
            });
        }
        
        function updateApplicationStatus(applicationId, status) {
            const success = Storage.updateApplicationStatus(applicationId, status);
            if (success) {
                loadApplications();
            } else {
                alert('Failed to update status. Please try again.');
            }
        }
        
        loadApplications();
    </script>
</body>
</html>

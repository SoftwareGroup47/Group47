<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Profile - BUPT TA Recruitment System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="header-title">Profile Details</h1>
            <a href="mo_dashboard.html" class="btn btn-secondary btn-small">Back to Dashboard</a>
        </div>
        
        <div class="card">
            <div id="profileContent">
                <!-- Profile information dynamically generated by JavaScript -->
            </div>
            <div class="auth-link">
                <a href="mo_dashboard.html" class="link">Back to Dashboard</a>
            </div>
        </div>
    </div>
    
    <script src="js/storage.js"></script>
    <script src="js/fileUpload.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'MO') {
            window.location.href = 'login.html';
        }
        
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        function loadProfile() {
            const username = getUrlParam('username');
            if (!username) {
                document.getElementById('profileContent').innerHTML = '<div class="empty-state">User information not found.</div>';
                return;
            }
            
            const user = Storage.findUserByUsername(username);
            if (!user) {
                document.getElementById('profileContent').innerHTML = '<div class="empty-state">User information not found.</div>';
                return;
            }
            
            let html = `
                <div class="profile-section">
                    <div class="profile-label">Username</div>
                    <div class="profile-value">${user.username}</div>
                </div>
                <div class="profile-section">
                    <div class="profile-label">Role</div>
                    <div class="profile-value">${user.role === 'TA' ? 'Teaching Assistant' : 'Module Organiser'}</div>
                </div>
                <div class="profile-section">
                    <div class="profile-label">Skills</div>
                    <div class="profile-value">${user.skills || 'N/A'}</div>
                </div>
                <div class="profile-section">
                    <div class="profile-label">Grades</div>
                    <div class="profile-value">${user.grades || 'N/A'}</div>
                </div>
                <div class="profile-section">
                    <div class="profile-label">CV</div>
                    <div class="profile-value">
            `;
            
            if (user.cvFileId) {
                const file = FileUpload.getFile(user.cvFileId);
                if (file) {
                    const fileUrl = FileUpload.getFileUrl(user.cvFileId);
                    if (fileUrl) {
                        html += `<a href="${fileUrl}" class="link" target="_blank">${file.name}</a>`;
                    } else {
                        html += file.name;
                    }
                } else {
                    html += 'N/A';
                }
            } else {
                html += 'N/A';
            }
            
            html += `
                    </div>
                </div>
            `;
            
            document.getElementById('profileContent').innerHTML = html;
        }
        
        loadProfile();
    </script>
</body>
</html>
